site_name: FaaScinator
site_description: Run Java CLI applications as serverless functions
site_url: https://oleg-nenashev.github.io/FaaScinator/
repo_url: https://github.com/oleg-nenashev/FaaScinator
repo_name: oleg-nenashev/FaaScinator
edit_uri: edit/main/docs/

# Build
site_dir: _site
docs_dir: .

nav:
  - Home: README.md
  - Demo:
    - Quickstart: demo/currentTime/README.md
  - Contributing: 
    - Contributor Guide: CONTRIBUTING.md
    - Code of Conduct: CODE_OF_CONDUCT.md

plugins:
  - search
  - autorefs
  - macros
  - mkdocs-pdf
  - social:
      cards_layout_options:
        background_color: "#34365F"
  - same-dir

theme:
  name: material
  logo: docs/images/logo.png
  favicon: docs/images/logo.png
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true



copyright: Copyright &copy; 2021-2026 Oleg Nenashev and FaaScinator contributors
